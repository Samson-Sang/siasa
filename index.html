<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR Video & Text Switcher</title>
  <!-- Include A-Frame and MindAR libraries -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- UI Overlay for Screen Text -->
  <div id="ui-container" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; font-family: sans-serif; border-radius: 8px; font-size: 18px; text-align: center;">
    Scan your marker to trigger content
  </div>

  <!-- AR Scene -->
  <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.1/examples/image-tracking/assets/card-example/card.mind;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Load your video asset -->
      <video id="ar-video" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" crossorigin="anonymous" loop></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Entity (index 0 corresponds to the first image in the .mind file) -->
    <a-entity id="my-target" mindar-image-target="targetIndex: 0">
      <!-- Attached Video Plane tracking the marker -->
      <a-video src="#ar-video" position="0 0 0" width="1" height="0.55" rotation="0 0 0"></a-video>
    </a-entity>
    
  </a-scene>

  <!-- JavaScript to Handle Video Playback and Screen Text Changes -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const targetEntity = document.querySelector("#my-target");
      const videoElement = document.querySelector("#ar-video");
      const uiContainer = document.querySelector("#ui-container");

      // When the marker is found in the camera view
      targetEntity.addEventListener("targetFound", () => {
        uiContainer.innerText = "Marker Found! Playing Video & Updating Values...";
        uiContainer.style.background = "rgba(0, 150, 0, 0.8)";
        videoElement.play();
      });

      // When the marker leaves the camera view
      targetEntity.addEventListener("targetLost", () => {
        uiContainer.innerText = "Marker Lost. Point camera back at target.";
        uiContainer.style.background = "rgba(150, 0, 0, 0.8)";
        videoElement.pause();
      });
    });
  </script>

</body>
</html>
